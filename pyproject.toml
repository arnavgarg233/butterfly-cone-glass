[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-cone-glass"
version = "1.0.0"
description = "The deterministic butterfly cone of a structural glass, its cage-amplitude ceiling and its entropy-tracking rate"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "numpy==2.3.4",
  "scipy==1.16.3",
  "matplotlib==3.10.7",
  "torch==2.9.1",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["butterfly_cone*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
